name: Node.js CI with Docker

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Run tests
      - name: Run tests
        run: npm test

      # 5️⃣ Build Docker image
      - name: Build Docker image
        run: docker build -t my-app:latest -f server/Dockerfile ./server

      # 6️⃣ Run Docker container to test server
      - name: Test Docker container
        run: |
          docker run --rm \
            -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
            -p 5000:5000 \
            my-app:latest \
            node app.js