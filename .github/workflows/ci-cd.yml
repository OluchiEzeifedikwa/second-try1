name: Node.js CI with Docker

on:
  push:
    branches: [main]

jobs:
  build-test-docker:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t my-app:latest .

      - name: Optional: Run Docker container
        run: docker run --rm -p 5000:5000 my-app:latest echo "Docker container built successfully"